<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signing in… — Wana Dating</title>
</head>
<body style="font-family:sans-serif;padding:24px;text-align:center">
<p id="status">Signing you in…</p>
<script src="js/vendor/supabase.js"></script>
<script src="../config.js"></script>
<script>
  // config.js creates the global `_supabase` client. It reads the OAuth
  // tokens/code from this page's URL and stores the session.
  (async () => {
    const status = document.getElementById("status");
    try {
      let { data: { session } } = await _supabase.auth.getSession();
      if (!session) {
        // give the client a moment to finish exchanging the URL tokens/code
        session = await new Promise((resolve) => {
          const t = setTimeout(() => resolve(null), 4000);
          _supabase.auth.onAuthStateChange((_e, s) => {
            if (s) { clearTimeout(t); resolve(s); }
          });
        });
      }
      if (!session) throw new Error("No session");

      const payload = {
        type: "wana-auth-done",
        access_token: session.access_token,
        refresh_token: session.refresh_token
      };
      let sent = false;
      // Google's sign-in page can cut the link to the opener window, so send through two routes.
      try { if (window.opener && !window.opener.closed) { window.opener.postMessage(payload, window.location.origin); sent = true; } } catch (_) {}
      try { const bc = new BroadcastChannel("wana-auth"); bc.postMessage(payload); sent = true; setTimeout(() => bc.close(), 1500); } catch (_) {}
      if (sent) {
        status.textContent = "Signed in. Returning to Wana Dating…";
        setTimeout(() => { try { window.close(); } catch (_) {} }, 400);
        // If this window could not close itself (opened as a normal tab), continue in it.
        setTimeout(() => { window.location.replace("index.html"); }, 1500);
      } else {
        window.location.replace("index.html");
      }
    } catch (err) {
      status.textContent = "Sign-in failed. You can close this window and try again.";
    }
  })();
</script>
</body>
</html>
