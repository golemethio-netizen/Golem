<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dating — WanaGebya</title>
<style>
:root{--green:#0A291A;--green-light:#123B27;--gold:#F5A623;--gold-soft:#FCE3B4;--ink:#1B1B1B;--paper:#FBF8F2;--line:#E4DCC8;--danger:#B3261E;}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);}
header{background:var(--green);color:#fff;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;}
header .brand{font-weight:700;font-size:1.1rem;letter-spacing:.02em;}
header .brand span{color:var(--gold);}
header nav a,header button.lang{background:none;border:none;color:#fff;opacity:.85;font-size:.9rem;cursor:pointer;margin-left:14px;text-decoration:none;}
header nav a:hover{opacity:1;}
.tabs{display:flex;gap:6px;max-width:960px;margin:20px auto 0;padding:0 16px;overflow-x:auto;}
.tab{padding:10px 18px;border-radius:8px 8px 0 0;cursor:pointer;background:#fff;border:1px solid var(--line);border-bottom:none;font-size:.92rem;color:#555;white-space:nowrap;}
.tab.active{background:var(--paper);color:var(--green);font-weight:700;border-color:var(--gold);}
main{max-width:960px;margin:0 auto;padding:20px 16px 60px;}
.panel{background:#fff;border:1px solid var(--line);border-radius:0 10px 10px 10px;padding:20px;min-height:300px;}
.gate{text-align:center;padding:40px 20px;color:#555;}
.gate button{margin-top:14px;background:var(--gold);color:var(--green);border:none;padding:10px 22px;border-radius:8px;font-weight:700;cursor:pointer;}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.filters select,.filters input{padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:.88rem;}
.filters button{background:var(--green);color:#fff;border:none;border-radius:7px;padding:8px 16px;cursor:pointer;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}
.card{border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;background:#fff;transition:transform .12s ease,box-shadow .12s ease;}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08);}
.card .photo{width:100%;aspect-ratio:1/1;background:var(--green-light) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--gold-soft);font-size:2rem;}
.card .info{padding:10px 12px;}
.card .name-age{font-weight:700;font-size:.95rem;}
.card .meta{font-size:.8rem;color:#777;margin-top:2px;}
.empty{text-align:center;color:#888;padding:40px 10px;}
form.post-form{display:grid;gap:14px;max-width:520px;}
form.post-form label{font-size:.85rem;font-weight:600;color:#333;display:block;margin-bottom:5px;}
form.post-form input,form.post-form select,form.post-form textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-size:.92rem;font-family:inherit;}
form.post-form textarea{min-height:110px;resize:vertical;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.checkbox-line{display:flex;align-items:flex-start;gap:8px;font-size:.85rem;color:#444;}
.checkbox-line input{width:auto !important;margin-top:2px;}
.submit-btn{background:var(--green);color:#fff;border:none;padding:12px;border-radius:8px;font-weight:700;cursor:pointer;font-size:.95rem;}
.submit-btn:disabled{opacity:.5;cursor:not-allowed;}
.msg{font-size:.85rem;padding:10px;border-radius:7px;margin-top:6px;}
.msg.error{background:#FBEAE9;color:var(--danger);}
.msg.success{background:#E9F5EC;color:#1E6B37;}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
.modal{background:#fff;border-radius:12px;max-width:420px;width:100%;overflow:hidden;max-height:90vh;overflow-y:auto;}
.modal .photo{width:100%;aspect-ratio:4/3;background:var(--green-light) center/cover no-repeat;}
.modal .body{padding:18px;}
.modal h3{margin:0 0 4px;}
.modal .meta{color:#777;font-size:.85rem;margin-bottom:12px;}
.modal .bio{font-size:.92rem;line-height:1.5;color:#333;white-space:pre-wrap;}
.modal textarea{width:100%;min-height:90px;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-family:inherit;font-size:.92rem;}
.modal .actions{display:flex;gap:10px;margin-top:16px;}
.modal .actions button{flex:1;padding:10px;border-radius:8px;border:none;font-weight:700;cursor:pointer;}
.btn-contact{background:var(--gold);color:var(--green);}
.btn-report{background:#fff;color:var(--danger);border:1px solid var(--danger) !important;}
.btn-close{background:none;border:none;font-size:1.1rem;float:right;cursor:pointer;color:#888;}
.thread{padding:12px;border-bottom:1px solid var(--line);cursor:pointer;}
.thread .when{font-size:.78rem;color:#999;}
</style>
</head>
<body>
<header>
  <div class="brand">WanaGebya <span>Dating</span></div>
  <nav>
    <button class="lang" onclick="toggleLang()" id="langBtn">አማ</button>
    <a href="index.html">← Marketplace</a>
  </nav>
</header>

<div class="tabs">
  <div class="tab active" data-tab="browse" onclick="switchTab('browse')">Browse</div>
  <div class="tab" data-tab="post" onclick="switchTab('post')">Post a Profile</div>
  <div class="tab" data-tab="messages" onclick="switchTab('messages')">Messages <span id="unreadBadge"></span></div>
  <div class="tab" data-tab="myprofile" onclick="switchTab('myprofile')">My Profile</div>
</div>

<main>
  <div class="panel" id="gate" style="display:none;">
    <div class="gate">
      <p>You need to be signed in to view or post in Dating.</p>
      <button onclick="window.location.href='login.html?redirect=dating.html'">Sign in</button>
    </div>
  </div>

  <div class="panel" id="browsePanel" style="display:none;">
    <div class="filters">
      <select id="filterSeeking">
        <option value="">Show: everyone</option>
        <option value="Male">Men</option>
        <option value="Female">Women</option>
      </select>
      <select id="filterType">
        <option value="">Any purpose</option>
        <option value="Friendship">Friendship</option>
        <option value="Dating">Dating</option>
        <option value="Marriage">Marriage</option>
      </select>
      <input type="text" id="filterCity" placeholder="City">
      <button onclick="loadProfiles()">Filter</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="emptyState" style="display:none;">No profiles match yet — check back soon.</div>
  </div>

  <div class="panel" id="postPanel" style="display:none;">
    <form class="post-form" id="postForm">
      <div class="row2">
        <div><label>Age</label><input type="number" id="fAge" min="18" max="99" required></div>
        <div><label>City</label><input type="text" id="fCity" maxlength="60" required></div>
      </div>
      <div class="row2">
        <div><label>I am</label>
          <select id="fGender" required><option value="">Select</option><option>Male</option><option>Female</option></select></div>
        <div><label>Looking for</label>
          <select id="fSeeking" required><option value="">Select</option><option>Male</option><option>Female</option><option>Any</option></select></div>
      </div>
      <div><label>Purpose</label>
        <select id="fType" required><option value="">Select</option><option>Friendship</option><option>Dating</option><option>Marriage</option></select></div>
      <div><label>About you (max 500 characters)</label>
        <textarea id="fBio" maxlength="500" required placeholder="Tell people a bit about yourself..."></textarea></div>
      <div><label>Photo (image, max 5 MB)</label><input type="file" id="fPhoto" accept="image/*"></div>
      <div class="checkbox-line">
        <input type="checkbox" id="fAgeConfirm" required>
        <label for="fAgeConfirm" style="margin:0;font-weight:400;">I confirm I am 18 years or older and this information is accurate.</label>
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">Post my profile</button>
      <div id="formMsg"></div>
    </form>
  </div>

  <div class="panel" id="messagesPanel" style="display:none;">
    <div id="threadList"></div>
    <div class="empty" id="messagesEmpty" style="display:none;">No messages yet. Message someone from Browse to start a conversation.</div>
  </div>

  <div class="panel" id="myProfilePanel" style="display:none;"><div id="myProfileContent"></div></div>
</main>

<div id="modalRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/supabase/2.39.7/supabase.min.js"></script>
   <script src="dating-fixes.js"></script> 
<script>
// ---------- Config ----------
const SUPABASE_URL = "https://ryeylhawdmykbbmnfrrh.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5ZXlsaGF3ZG15a2JibW5mcnJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA2MzU4NjcsImV4cCI6MjA4NjIxMTg2N30.6FpidGEaunpf8AwBIpjKwcC3a53iWmvaRxctj2ZYrSY";
const STORAGE_BUCKET = "product-images";
const MAX_PHOTO_BYTES = 5 * 1024 * 1024;

// Client is named "sb" so it never collides with the CDN's window.supabase
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let currentLang = localStorage.getItem("dating_lang") || "en";
let blocked = new Set();

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const photoStyle = url => url ? esc(`background-image:url("${encodeURI(url)}")`) : "";
const alertBox = (type, text) => `<div class="msg ${type}">${esc(text)}</div>`;

// ---------- Auth ----------
async function initAuth(){
  const { data: { user } } = await sb.auth.getUser();
  currentUser = user;
  $("gate").style.display = user ? "none" : "block";
  $("browsePanel").style.display = user ? "block" : "none";
  if (user){
    await loadBlocked();
    loadProfiles();
    refreshUnreadBadge();
  }
}

async function loadBlocked(){
  const { data } = await sb.from("dating_blocks").select("blocked_id").eq("blocker_id", currentUser.id);
  blocked = new Set((data || []).map(r => r.blocked_id));
}

async function refreshUnreadBadge(){
  const { count } = await sb.from("dating_messages")
    .select("*", { count: "exact", head: true })
    .eq("recipient_id", currentUser.id).eq("read", false);
  $("unreadBadge").textContent = count ? `(${count})` : "";
}

// ---------- Tabs ----------
const PANELS = ["browsePanel","postPanel","messagesPanel","myProfilePanel"];
function switchTab(tab){
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
  PANELS.forEach(p => $(p).style.display = "none");
  if (!currentUser){ $("gate").style.display = "block"; return; }
  $("gate").style.display = "none";
  const map = { browse:"browsePanel", post:"postPanel", messages:"messagesPanel", myprofile:"myProfilePanel" };
  $(map[tab]).style.display = "block";
  if (tab === "browse") loadProfiles();
  if (tab === "messages"){ loadThreads(); refreshUnreadBadge(); }
  if (tab === "myprofile") loadMyProfile();
}

// ---------- Browse ----------
async function loadProfiles(){
  const seeking = $("filterSeeking").value;
  const type = $("filterType").value;
  const city = $("filterCity").value.trim().replace(/[%,()]/g, "");

  // Filters run on the server so we don't download every profile
  let q = sb.from("products").select("*")
    .eq("category", "Dating")
    .neq("user_id", currentUser.id)
    .order("created_at", { ascending: false })
    .limit(100);
  if (seeking) q = q.eq("specs->>gender", seeking);
  if (type) q = q.eq("specs->>relationship_type", type);
  if (city) q = q.ilike("specs->>city", `%${city}%`);

  const { data, error } = await q;
  const grid = $("grid"), empty = $("emptyState");
  grid.innerHTML = "";

  if (error){
    empty.textContent = "Couldn't load profiles right now.";
    empty.style.display = "block";
    console.error(error);
    return;
  }

  const rows = (data || []).filter(r => !blocked.has(r.user_id));
  if (!rows.length){
    empty.textContent = "No profiles match yet — check back soon.";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  rows.forEach(row => {
    const s = row.specs || {};
    const img = row.images && row.images[0];
    const card = document.createElement("div");
    card.className = "card";
    card.addEventListener("click", () => openModal(row));
    card.innerHTML = `
      <div class="photo" style="${photoStyle(img)}">${img ? "" : "👤"}</div>
      <div class="info">
        <div class="name-age">${esc(s.gender)}, ${esc(s.age ?? "?")}</div>
        <div class="meta">${esc(s.city)} · ${esc(s.relationship_type)}</div>
      </div>`;
    grid.appendChild(card);
  });
}

// ---------- Modals ----------
function closeModal(){ $("modalRoot").innerHTML = ""; }

function openModal(row){
  const s = row.specs || {};
  const img = row.images && row.images[0];
  $("modalRoot").innerHTML = `
    <div class="modal-backdrop" id="mBack">
      <div class="modal">
        <div class="photo" style="${photoStyle(img)}"></div>
        <div class="body">
          <button class="btn-close" id="mClose">✕</button>
          <h3>${esc(s.gender)}, ${esc(s.age ?? "?")}</h3>
          <div class="meta">${esc(s.city)} · Looking for ${esc(s.seeking)} · ${esc(s.relationship_type)}</div>
          <div class="bio">${esc(s.bio)}</div>
          <div class="actions">
            <button class="btn-contact" id="mMsg">Message</button>
            <button class="btn-report" id="mReport">Report</button>
          </div>
          <div class="actions" style="margin-top:8px;">
            <button class="btn-report" id="mBlock">Block this user</button>
          </div>
        </div>
      </div>
    </div>`;
  $("mBack").addEventListener("click", e => { if (e.target.id === "mBack") closeModal(); });
  $("mClose").addEventListener("click", closeModal);
  $("mMsg").addEventListener("click", () => composeModal(row.id, row.user_id));
  $("mReport").addEventListener("click", () => reportProfile(row.id));
  $("mBlock").addEventListener("click", () => blockUser(row.user_id));
}

function composeModal(productId, recipientId){
  $("modalRoot").innerHTML = `
    <div class="modal-backdrop" id="mBack">
      <div class="modal"><div class="body">
        <button class="btn-close" id="mClose">✕</button>
        <h3>Send a message</h3>
        <textarea id="composeBody" maxlength="1000" placeholder="Say hello..."></textarea>
        <div class="actions"><button class="btn-contact" id="mSend">Send</button></div>
        <div id="composeMsg"></div>
      </div></div>
    </div>`;
  $("mBack").addEventListener("click", e => { if (e.target.id === "mBack") closeModal(); });
  $("mClose").addEventListener("click", closeModal);
  $("mSend").addEventListener("click", () => sendMessage(productId, recipientId, "composeBody", "composeMsg"));
}

// One send function for both new messages and replies (input/message box IDs are passed in)
async function sendMessage(productId, recipientId, inputId, msgId){
  const input = $(inputId), out = $(msgId);
  const body = input.value.trim();
  if (!body){ out.innerHTML = alertBox("error", "Write something first."); return; }
  if (blocked.has(recipientId)){ out.innerHTML = alertBox("error", "You blocked this user."); return; }

  const { error } = await sb.from("dating_messages").insert({
    product_id: productId, sender_id: currentUser.id, recipient_id: recipientId, body
  });
  if (error){
    out.innerHTML = alertBox("error", "Couldn't send: " + error.message);
  } else {
    out.innerHTML = alertBox("success", "Sent.");
    setTimeout(() => { closeModal(); loadThreads(); }, 700);
  }
}

async function reportProfile(productId){
  const reason = prompt("What's the issue with this profile?");
  if (!reason || !reason.trim()) return;
  const { error } = await sb.from("dating_reports").insert({
    reported_product_id: productId, reporter_id: currentUser.id, reason: reason.trim().slice(0, 500)
  });
  alert(!error ? "Report submitted. Thank you."
    : error.code === "23505" ? "You've already reported this profile."
    : "Couldn't submit report, try again.");
  closeModal();
}

async function blockUser(userId){
  if (!confirm("Block this user? You won't see their profile or messages.")) return;
  const { error } = await sb.from("dating_blocks").insert({ blocker_id: currentUser.id, blocked_id: userId });
  if (error && error.code !== "23505"){ alert("Couldn't block: " + error.message); return; }
  blocked.add(userId);
  closeModal();
  loadProfiles();
}

// ---------- Messages ----------
async function loadThreads(){
  const { data, error } = await sb.from("dating_messages").select("*")
    .or(`sender_id.eq.${currentUser.id},recipient_id.eq.${currentUser.id}`)
    .order("created_at", { ascending: false }).limit(300);

  const list = $("threadList"), empty = $("messagesEmpty");
  list.innerHTML = "";
  if (error || !data || !data.length){ empty.style.display = "block"; return; }

  const threads = {};
  data.forEach(m => {
    const other = m.sender_id === currentUser.id ? m.recipient_id : m.sender_id;
    if (blocked.has(other)) return;
    const key = `${m.product_id}__${other}`;
    if (!threads[key]) threads[key] = { other, productId: m.product_id, messages: [] };
    threads[key].messages.push(m);
  });

  const items = Object.values(threads);
  if (!items.length){ empty.style.display = "block"; return; }
  empty.style.display = "none";

  items.forEach(thread => {
    const last = thread.messages[0];
    const unread = thread.messages.some(m => !m.read && m.recipient_id === currentUser.id);
    const div = document.createElement("div");
    div.className = "thread";
    div.innerHTML = `<div style="font-weight:${unread ? 700 : 400};">${esc(last.body.slice(0, 80))}</div>
      <div class="when">${esc(new Date(last.created_at).toLocaleString())}</div>`;
    div.addEventListener("click", () => openThread(thread));
    list.appendChild(div);
  });
}

async function openThread(thread){
  const ordered = [...thread.messages].reverse();
  $("modalRoot").innerHTML = `
    <div class="modal-backdrop" id="mBack">
      <div class="modal"><div class="body">
        <button class="btn-close" id="mClose">✕</button>
        <h3>Conversation</h3>
        <div style="max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin:10px 0;">
          ${ordered.map(m => {
            const mine = m.sender_id === currentUser.id;
            return `<div style="align-self:${mine ? "flex-end" : "flex-start"};background:${mine ? "var(--gold-soft)" : "#F0F0F0"};padding:8px 12px;border-radius:10px;max-width:80%;font-size:.88rem;white-space:pre-wrap;">${esc(m.body)}</div>`;
          }).join("")}
        </div>
        <textarea id="replyBody" maxlength="1000" placeholder="Reply..."></textarea>
        <div class="actions"><button class="btn-contact" id="mReply">Reply</button></div>
        <div id="replyMsg"></div>
      </div></div>
    </div>`;
  $("mBack").addEventListener("click", e => { if (e.target.id === "mBack") closeModal(); });
  $("mClose").addEventListener("click", closeModal);
  $("mReply").addEventListener("click", () => sendMessage(thread.productId, thread.other, "replyBody", "replyMsg"));

  // Mark incoming messages read, wait for it, then refresh the badge
  const unreadIds = thread.messages.filter(m => m.recipient_id === currentUser.id && !m.read).map(m => m.id);
  if (unreadIds.length){
    await sb.from("dating_messages").update({ read: true }).in("id", unreadIds);
    refreshUnreadBadge();
  }
}

// ---------- My Profile ----------
function opts(list, selected){
  return list.map(v => `<option${v === selected ? " selected" : ""}>${esc(v)}</option>`).join("");
}

async function loadMyProfile(){
  const el = $("myProfileContent");
  const { data: rows, error } = await sb.from("products").select("*")
    .eq("category", "Dating").eq("user_id", currentUser.id)
    .order("created_at", { ascending: false }).limit(1);
  const data = rows && rows[0];

  if (error || !data){
    el.innerHTML = `<div class="empty">You haven't posted a profile yet. Use the "Post a Profile" tab.</div>`;
    return;
  }
  const s = data.specs || {};
  el.innerHTML = `
    <form class="post-form" id="editForm">
      <div class="row2">
        <div><label>Age</label><input type="number" id="eAge" min="18" max="99" value="${esc(s.age)}" required></div>
        <div><label>City</label><input type="text" id="eCity" maxlength="60" value="${esc(s.city)}" required></div>
      </div>
      <div class="row2">
        <div><label>Looking for</label><select id="eSeeking">${opts(["Male","Female","Any"], s.seeking)}</select></div>
        <div><label>Purpose</label><select id="eType">${opts(["Friendship","Dating","Marriage"], s.relationship_type)}</select></div>
      </div>
      <div><label>About you</label><textarea id="eBio" maxlength="500" required>${esc(s.bio)}</textarea></div>
      <button type="submit" class="submit-btn">Save changes</button>
      <button type="button" class="submit-btn" style="background:var(--danger);" id="deleteBtn">Delete my profile</button>
      <div id="editMsg"></div>
    </form>`;

  $("editForm").addEventListener("submit", async e => {
    e.preventDefault();
    const age = parseInt($("eAge").value, 10);
    if (!(age >= 18 && age <= 99)){ $("editMsg").innerHTML = alertBox("error", "Age must be 18–99."); return; }
    const { error: updErr } = await sb.from("products").update({
      specs: { ...s, age, city: $("eCity").value.trim(), seeking: $("eSeeking").value,
               relationship_type: $("eType").value, bio: $("eBio").value.trim() }
    }).eq("id", data.id).eq("user_id", currentUser.id);
    $("editMsg").innerHTML = updErr ? alertBox("error", updErr.message) : alertBox("success", "Saved.");
  });

  $("deleteBtn").addEventListener("click", async () => {
    if (!confirm("Delete your dating profile? This can't be undone.")) return;
    const { error: delErr } = await sb.from("products").delete().eq("id", data.id).eq("user_id", currentUser.id);
    if (delErr){ alert("Couldn't delete: " + delErr.message); return; }
    loadMyProfile();
  });
}

// ---------- Post form ----------
$("postForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("submitBtn"), msg = $("formMsg");
  msg.innerHTML = "";

  if (!currentUser){ msg.innerHTML = alertBox("error", "Please sign in first."); return; }
  const age = parseInt($("fAge").value, 10);
  if (!(age >= 18 && age <= 99) || !$("fAgeConfirm").checked){
    msg.innerHTML = alertBox("error", "You must be 18 or older to post here."); return;
  }

  const file = $("fPhoto").files[0];
  if (file){
    if (!file.type.startsWith("image/")){ msg.innerHTML = alertBox("error", "Please choose an image file."); return; }
    if (file.size > MAX_PHOTO_BYTES){ msg.innerHTML = alertBox("error", "Photo must be under 5 MB."); return; }
  }

  btn.disabled = true; btn.textContent = "Posting...";
  const reset = () => { btn.disabled = false; btn.textContent = "Post my profile"; };

  // One dating profile per user
  const { data: existing } = await sb.from("products").select("id")
    .eq("category", "Dating").eq("user_id", currentUser.id).limit(1);
  if (existing && existing.length){
    msg.innerHTML = alertBox("error", "You already have a profile. Edit it in My Profile.");
    reset(); return;
  }

  let imageUrl = null;
  if (file){
    const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 5) || "jpg";
    const path = `dating/${currentUser.id}-${Date.now()}.${ext}`;
    const { error: uploadErr } = await sb.storage.from(STORAGE_BUCKET).upload(path, file, { contentType: file.type });
    if (uploadErr){
      msg.innerHTML = alertBox("error", "Photo upload failed: " + uploadErr.message);
      reset(); return;
    }
    imageUrl = sb.storage.from(STORAGE_BUCKET).getPublicUrl(path).data.publicUrl;
  }

  const productCode = `WG-${new Date().getFullYear()}-DT-${Math.random().toString(36).slice(2, 8).toUpperCase()}`;
  const { error } = await sb.from("products").insert({
    user_id: currentUser.id,
    category: "Dating",
    product_code: productCode,
    age_confirmed: true,
    images: imageUrl ? [imageUrl] : [],
    specs: {
      age,
      gender: $("fGender").value,
      seeking: $("fSeeking").value,
      relationship_type: $("fType").value,
      city: $("fCity").value.trim(),
      bio: $("fBio").value.trim()
    }
  });

  reset();
  if (error){
    msg.innerHTML = alertBox("error", "Something went wrong: " + error.message);
  } else {
    msg.innerHTML = alertBox("success", "Profile posted!");
    $("postForm").reset();
  }
});
